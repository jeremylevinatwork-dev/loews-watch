name: watchOS build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip loews-watch-app-v1.zip
      - name: Build watchOS app for simulator (unsigned)
        run: |
          xcodebuild -project loews-watch/LoewsWatch.xcodeproj \
            -scheme LoewsWatch \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
